[project]
name = "trading-bot-backend"
version = "0.1.0"
description = "Broker-agnostic algorithmic trading platform backend (Phase 0 foundations)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "ntplib>=0.4",
    "websockets>=13.0",
    "httpx>=0.27",
    "smartapi-python>=1.5.5",
    # Ops-Hardening Phase 3 (trade-log Excel export) — deliberately openpyxl
    # alone, not pandas: pandas pulls in numpy, whose stub files use Python
    # 3.12+ syntax that breaks `mypy app tests` under this project's
    # python_version = "3.11" target (see the `truedata` extra's own comment
    # below for the full story — pandas has been kept out of the main .venv
    # for exactly this reason since before this phase). openpyxl has no
    # numpy/pandas dependency at all, and writing/appending xlsx rows never
    # needed DataFrame machinery in the first place.
    "openpyxl>=3.1",
    # Transitive dependency smartapi-python's own installed metadata (1.5.5)
    # doesn't declare — SmartApi/smartConnect.py imports it directly, and
    # SmartApi/__init__.py eagerly imports smartConnect, so even importing
    # only SmartApi.smartWebSocketV2 (as angel_ws_client.py does) fails
    # without this pinned explicitly.
    "logzero>=1.7.0",
    # Same reason as logzero — SmartApi/__init__.py also eagerly imports
    # smartApiWebsocket.py (an older, unrelated class this codebase never
    # uses), which imports `websocket` (the websocket-client package)
    # directly, undeclared in smartapi-python's own installed metadata.
    "websocket-client>=1.9.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "import-linter>=2.1",
]
# Only for MARKET_DATA_PROVIDER=truedata (market_data/providers/
# truedata_provider.py) — deliberately kept out of the main dependency
# list and never installed into the shared .venv, same reasoning as the
# backtest extra on branch backup/atr-backtest-session: `truedata` pulls
# in pandas (confirmed via its own PyPI-published requires_dist), and
# pandas' own numpy dependency ships stub files using Python 3.12+ syntax
# that break `mypy app tests` (this project's python_version = "3.11"
# target) the moment numpy exists anywhere in the environment. Confirmed
# directly: pandas isn't in the main .venv today, and `mypy app tests`
# is clean because of that — install this into its own separate venv only,
# when actually running against real TrueData credentials.
#
# 2026-08-11: switched from `truedata-ws` (last released 5.0.11, Nov 2023,
# no newer version published since) to `truedata` (7.0.1, Jul 2025) —
# confirmed via PyPI directly to be the same project's current name
# (identical GitHub repo, `kapilmar/truedata-ws`), not an unrelated
# package, and it's what TrueData's own official docs' Python client
# section now names. `truedata_provider.py` was rewritten against this
# package's actual installed source (not a paraphrase) — see that
# module's own docstring for the full list of what changed.
truedata = [
    "truedata>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations follow Alembic's own generated template conventions (Union/Sequence
# from typing, etc.) — not worth fighting pyupgrade rules on generated boilerplate.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in default arg) is FastAPI's own Depends(...) idiom —
# a real bug in general Python, but the correct pattern here.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
