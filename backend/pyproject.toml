[project]
name = "trading-bot-backend"
version = "0.1.0"
description = "Broker-agnostic algorithmic trading platform backend (Phase 0 foundations)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "ntplib>=0.4",
    "websockets>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations follow Alembic's own generated template conventions (Union/Sequence
# from typing, etc.) — not worth fighting pyupgrade rules on generated boilerplate.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in default arg) is FastAPI's own Depends(...) idiom —
# a real bug in general Python, but the correct pattern here.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
